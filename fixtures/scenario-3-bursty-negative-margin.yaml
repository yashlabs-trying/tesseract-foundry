# Scenario 3: Bursty vs steady demand with negative margin possibility
model:
  model_id: mistralai/Mixtral-8x22B
  model_revision: main
  source: huggingface
  architecture: mixture_of_experts
  parameter_count: 141000000000
  context_length: 65536
  weight_dtype: bf16
  supported_backends:
    - vllm

hardware:
  - hardware_id: h100-1
    vendor: nvidia
    gpu_model: H100
    gpu_sku: H100-SXM-80GB
    device_count: 1
    vram_per_gpu_gb: 80.0
    memory_bandwidth_gbps: 3350.0
    interconnect: NVLink
    supported_precision:
      - fp16
      - bf16
      - fp8
      - int8
    cost_per_gpu_hour_usd: 3.50
    price_provenance: list_price
    capacity_type: on_demand
  - hardware_id: a100-4x
    vendor: nvidia
    gpu_model: A100
    gpu_sku: A100-SXM-80GB
    device_count: 4
    vram_per_gpu_gb: 80.0
    memory_bandwidth_gbps: 2039.0
    interconnect: NVLink
    supported_precision:
      - fp16
      - bf16
      - int8
    cost_per_gpu_hour_usd: 2.50
    price_provenance: list_price
    capacity_type: reserved

workload:
  workload_id: bursty-demand
  request_rate_rps: 20.0
  concurrency: 32
  input_tokens:
    mean: 1024
    p50: 512
    p95: 4096
    p99: 8192
    max: 16384
  output_tokens:
    mean: 512
    p50: 256
    p95: 2048
    p99: 4096
    max: 8192
  burst_multiplier: 5.0
  peak_hours_per_day: 4
  idle_hours_per_day: 16
  warm_latency_target_ms: 1000
  reliability_objective: 0.995

min_contribution_margin_pct: 30.0
input_price_per_million: 0.05
output_price_per_million: 0.20
